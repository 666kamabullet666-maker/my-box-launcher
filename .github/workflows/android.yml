name: Build MY BOX DPI variants

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Build all DPI variants
        run: gradle --no-daemon assembleDebug

      - name: Validate APK structure, manifest, alignment and signature
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/debug/*.apk)
          if [ "${#apks[@]}" -ne 3 ]; then
            echo "Expected exactly 3 APK files, found ${#apks[@]}"
            printf '%s\\n' "${apks[@]}"
            exit 1
          fi

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          for apk in "${apks[@]}"; do
            echo "===== Checking $apk ====="
            test -s "$apk"
            unzip -t "$apk"
            badging="$("$AAPT" dump badging "$apk")"
            echo "$badging"
            grep -q "^sdkVersion:'23'$" <<< "$badging"
            grep -q "^targetSdkVersion:'28'$" <<< "$badging"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            "$ZIPALIGN" -c -v 4 "$apk"
          done

      - name: Install each APK on Android 9 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: |
            set -eu
            adb start-server
            adb wait-for-device
            echo "Emulator boot property:"
            adb shell getprop sys.boot_completed

            echo "===== Installing ByeByeDPI ====="
            adb install -r app/build/outputs/apk/byeByeDpi/debug/app-byeByeDpi-debug.apk
            adb shell pm path com.mybox.launcher.byebyedpi

            echo "===== Installing ZapretDroid ====="
            adb install -r app/build/outputs/apk/zapretDroid/debug/app-zapretDroid-debug.apk
            adb shell pm path com.mybox.launcher.zapretdroid

            echo "===== Installing ByeZapret ====="
            adb install -r app/build/outputs/apk/byeZapret/debug/app-byeZapret-debug.apk
            adb shell pm path com.mybox.launcher.byezapret

            echo "All three APKs installed successfully on Android 9."

      - name: Upload APKs for inspection or installation
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: my-box-dpi-variants
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
