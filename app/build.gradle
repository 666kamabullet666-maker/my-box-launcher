plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mybox.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mybox.launcher'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
